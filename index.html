<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avalon IELTS RPG: Infinite AI Dungeon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0d17;
            --panel-bg: #141729;
            --border-color: #3b4269;
            --hp-green: #2ecc71;
            --hp-red: #e74c3c;
            --gold: #f1c40f;
            --accent: #9b59b6;
            --text-color: #e2e8f0;
            --font-game: 'Chakra Petch', sans-serif;
            --font-body: 'Be Vietnam Pro', sans-serif;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-body);
            display: flex;
            justify-content: center;
        }

        #game-container {
            width: 950px;
            background: var(--panel-bg);
            border: 3px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.85);
            overflow: hidden;
            position: relative;
            transition: transform 0.1s ease;
        }

        /* Screen shake on damage */
        @keyframes screenDamage {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-8px, 6px); }
            40% { transform: translate(8px, -6px); }
            60% { transform: translate(-6px, 3px); }
            80% { transform: translate(6px, -3px); }
        }
        .screen-shake {
            animation: screenDamage 0.4s ease-in-out;
        }

        header {
            background: #0f1120;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            font-family: var(--font-game);
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .hp-bar-wrap {
            width: 200px;
            background: #2c3e50;
            height: 18px;
            border: 2px solid #fff;
            border-radius: 4px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-left: 8px;
        }
        .hp-bar {
            width: 100%;
            height: 100%;
            background: var(--hp-green);
            transition: width 0.3s ease, background-color 0.3s;
        }

        .hub-nav {
            display: flex;
            background: #101324;
            border-bottom: 2px solid var(--border-color);
        }
        .hub-btn {
            flex: 1;
            padding: 14px;
            background: transparent;
            border: none;
            color: #8a99ad;
            font-family: var(--font-game);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            border-right: 1px solid var(--border-color);
            text-transform: uppercase;
        }
        .hub-btn:hover, .hub-btn.active {
            background: #1e223d;
            color: var(--gold);
        }
        .hub-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .arena {
            padding: 24px;
            display: grid;
            grid-template-columns: 290px 1fr;
            gap: 24px;
            min-height: 480px;
        }

        .monster-view {
            background: #0c0e1a;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            transition: all 0.3s ease;
        }
        .monster-avatar {
            font-size: 75px;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 12px rgba(255,255,255,0.25));
            animation: bounce 2s infinite alternate ease-in-out;
            transition: transform 0.3s;
            display: inline-block;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        /* Monster Hit Animation */
        @keyframes monsterHitKeyframes {
            0% { transform: scale(1) translateX(0); filter: brightness(1); }
            15% { transform: scale(0.82) translateX(-16px) rotate(-14deg); filter: brightness(2.5) drop-shadow(0 0 20px #e74c3c); }
            35% { transform: scale(0.88) translateX(16px) rotate(12deg); filter: brightness(3) drop-shadow(0 0 25px #e74c3c); }
            55% { transform: scale(0.94) translateX(-10px) rotate(-6deg); filter: brightness(1.8) drop-shadow(0 0 15px #e74c3c); }
            75% { transform: scale(1.1) translateX(4px); }
            100% { transform: scale(1) translateX(0); filter: none; }
        }
        .monster-hit {
            animation: monsterHitKeyframes 0.65s cubic-bezier(0.36, 0.07, 0.19, 0.97) !important;
        }

        /* Floating Damage Text */
        .crit-text {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--font-game);
            font-size: 24px;
            font-weight: 800;
            color: #ff4757;
            text-shadow: 2px 2px 0 #000, 0 0 12px #ff4757;
            pointer-events: none;
            animation: floatUpAnim 0.75s ease-out forwards;
            z-index: 50;
        }
        @keyframes floatUpAnim {
            0% { opacity: 0; transform: translate(-50%, 0) scale(0.4); }
            25% { opacity: 1; transform: translate(-50%, -15px) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -50px) scale(1); }
        }

        .monster-name {
            font-family: var(--font-game);
            font-size: 16px;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 6px;
            transition: color 0.3s;
        }
        .timer-display {
            font-family: var(--font-game);
            font-size: 18px;
            font-weight: 700;
            color: #e67e22;
            margin-top: 15px;
        }

        .quest-box {
            background: #111322;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .badge-type {
            display: inline-block;
            font-family: var(--font-game);
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            background: var(--accent);
            color: #fff;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .passage-text {
            background: #080911;
            padding: 14px;
            border-left: 4px solid var(--accent);
            font-size: 14px;
            line-height: 1.65;
            margin-bottom: 16px;
            max-height: 160px;
            overflow-y: auto;
            border-radius: 0 4px 4px 0;
            transition: all 0.3s ease;
        }
        .quest-desc {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 14px;
            font-weight: 500;
        }

        /* Blank slot highlight */
        .blank-slot {
            display: inline-block;
            padding: 2px 10px;
            background: rgba(241, 196, 15, 0.15);
            border: 2px dashed var(--gold);
            color: var(--gold);
            border-radius: 4px;
            font-weight: 700;
            margin: 0 4px;
            letter-spacing: 1px;
            animation: blankPulse 2s infinite ease-in-out;
        }
        @keyframes blankPulse {
            0%, 100% { box-shadow: 0 0 0 rgba(241, 196, 15, 0); }
            50% { box-shadow: 0 0 8px rgba(241, 196, 15, 0.5); }
        }

        .option-item {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            margin-bottom: 8px;
            background: #181c30;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .option-item:hover { border-color: var(--gold); }
        .option-item input { margin-right: 12px; cursor: pointer; }

        .quest-input {
            width: 100%;
            background: #090a14;
            border: 2px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-family: var(--font-body);
            font-size: 15px;
            margin-bottom: 12px;
        }
        .quest-input:focus { outline: none; border-color: var(--gold); }

        .action-row {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }
        .game-btn {
            padding: 12px 20px;
            font-family: var(--font-game);
            font-size: 13px;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            text-transform: uppercase;
        }
        .game-btn:active { transform: scale(0.97); }
        .game-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .btn-submit { background: var(--hp-green); color: #000; }
        .btn-hint { background: var(--hp-red); color: #fff; }
        .btn-audio { background: #3498db; color: #fff; }
        .btn-next { background: var(--gold); color: #000; margin-left: auto; }

        /* Overlays */
        #objection-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(214, 48, 49, 0.94);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .objection-text {
            font-family: var(--font-game);
            font-size: 60px;
            font-weight: 800;
            color: #fff;
            text-shadow: 4px 4px 0px #000;
            animation: zoomShake 0.4s ease-out;
        }
        @keyframes zoomShake {
            0% { transform: scale(0.2) rotate(-8deg); }
            70% { transform: scale(1.15) rotate(4deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        #game-over-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 17, 32, 0.96);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        .game-over-text {
            font-family: var(--font-game);
            font-size: 70px;
            font-weight: 800;
            color: var(--hp-red);
            text-shadow: 4px 4px 0px #000;
            animation: zoomFade 0.5s ease-out;
            letter-spacing: 5px;
        }
        @keyframes zoomFade {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

            padding: 12px 24px;
            background: #080912;
            border-top: 2px solid var(--border-color);
            font-size: 14px;
            min-height: 50px;
            display: flex;
            align-items: center;
            color: var(--gold);
            font-weight: 500;
        }
    </style>
</head>

<div id="game-container">

        <button class="hub-btn active" onclick="selectSkill('reading')">1. READING</button>
        <button class="hub-btn" onclick="selectSkill('listening')">2. LISTENING</button>

            <div id="monster-name" class="monster-name">Obsidian Sphinx</div>
            <div id="monster-meta" style="font-size: 13px; color: #8a99ad; margin-top: 4px;">Floor 1 • Band 4.0</div>

</div>

<script>
// ==========================================
// API CONFIGURATION (LOCAL & RENDER COMPATIBLE)
// ==========================================
const API_BASE_URL = window.location.protocol === 'file:' 
    ? 'https://game-3qxq.onrender.com/api' 
    : '/api';

// Lock flag preventing multiple submissions or Enter spamming
let isActionLocked = false;

// ==========================================
// 1. AI SERVER COMMUNICATION
// ==========================================
async function callAI_GenerateQuest(skill) {
    log("🔮 The Oracle is bending dimensions to summon a quest...");
    const currentBand = BAND_THRESHOLDS[currentBandIndex].band;
    
    try {
        const response = await fetch(`${API_BASE_URL}/generate-quest`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ skill: skill, band: currentBand })
        });
        
        const data = await response.json();
        const questData = data.quest || data.data;
        if (data.success && questData) {
            return questData;
        } else {
            throw new Error("Invalid or empty response from server");
        }
    } catch (error) {
        console.error("AI Generation Error:", error);
        log("⚠️ The Oracle crystal disrupted. Engaging emergency backup challenge!");
        
        return {
            skill: skill,
            band: currentBand,
            type: skill === 'writing' ? "REBUTTAL_WRITING" : (skill === 'speaking' ? "SPEAKING_PROMPT" : "SHORT_ANSWER"),
            monster: "Disconnection Phantom",
            avatar: "📡",
            context: skill === 'speaking' 
                ? "Vocabulary cues: [benefit, disadvantage, perspective]" 
                : (skill === 'writing' 
                    ? "The chart illustrates the percentage of university graduates finding employment within six months in 2022."
                    : "Online education is becoming widespread. It allows students to study at their own pace."),
            prompt: skill === 'writing' 
                ? "Paraphrase this Task 1 introduction in 1 sentence using academic synonyms and varied grammar."
                : (skill === 'speaking' 
                    ? "Do you prefer studying online or in person? Why?" 
                    : "Complete summary: Online learning enables students to set their own [...]. (1 WORD ONLY)"),
            answer: skill === 'writing' ? ["illustrates", "depicts", "reveals", "shows"] : ["pace", "speed", "schedule"],
            explanation: "'at their own pace' means setting one's personal schedule.",
            hint: "Look for words related to rhythm or speed.",
            time: skill === 'writing' ? 65 : 40
        };
    }
}

async function callAI_EvaluateWriting(userText, questContext, questPrompt) {
    const currentBand = BAND_THRESHOLDS[currentBandIndex].band;
    try {
        const response = await fetch(`${API_BASE_URL}/evaluate-writing`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userText: userText, context: questContext, prompt: questPrompt, band: currentBand })
        });
        
        const data = await response.json();
        const evalData = data.evaluation || data.data;
        if (data.success && evalData) {
            return evalData;
        } else {
            throw new Error("Server returned error status");
        }
    } catch (error) {
        console.error("AI Evaluation Error:", error);
        return { 
            isPassed: false, 
            feedback: "The Oracle Examiner connection lost. Attack missed!", 
            damage: 20 
        };
    }
}

// ==========================================
// STATIC DATABASE FOR LEVEL 1 (BAND 4.0 START)
// ==========================================
const RAW_DATABASE = [
    {
        skill: "reading",
        band: "4.0",
        type: "SHORT_ANSWER",
        monster: "Slime Sentinel",
        avatar: "🟢",
        context: "Regular exercise maintains a healthy heart and improves blood circulation throughout the entire body.",
        prompt: "Complete summary: Physical activity ensures good blood [...] in the human body. (1 WORD ONLY)",
        answer: ["circulation", "flow"],
        explanation: "'improves blood circulation' refers to blood circulation.",
        hint: "Look for a medical term starting with 'c'.",
        time: 35
    },
    {
        skill: "listening",
        band: "4.0",
        type: "SHORT_ANSWER",
        monster: "Echo Sprite",
        avatar: "🧚",
        context: "Good morning passengers. The express train to London will depart at 10:15 AM from platform four.",
        prompt: "Note: The train to London leaves at [...] from platform four. (1 WORD/NUMBER)",
        answer: ["10:15", "10:15 am", "10.15"],
        explanation: "'depart at 10:15 AM' indicates the scheduled departure time.",
        hint: "Listen specifically for the departure time.",
        time: 35
    },
    {
        skill: "writing",
        band: "4.0",
        type: "REBUTTAL_WRITING",
        monster: "Logic Gargoyle",
        avatar: "🗿",
        context: "The line graph illustrates the percentage of households with Internet access in France from 2000 to 2010.",
        prompt: "Paraphrase this Task 1 introduction in 1 sentence using academic synonyms and varied grammar.",
        answer: ["depicts", "shows", "proportion", "households", "internet"],
        explanation: "Good Task 1 paraphrases use words like 'depicts', 'proportion', 'dwellings'.",
        hint: "Replace 'illustrates' with 'depicts' or 'shows'.",

    },
    {
        skill: "speaking",
        band: "4.0",
        type: "SPEAKING_PROMPT",

        avatar: "🧝",
        context: "Vocabulary cues: [free time, unwind, outdoor activities]",
        prompt: "What is your favorite hobby, and why do you enjoy it?",
        answer: ["hobby", "enjoy", "relax"],
        explanation: "Speak fluently for at least 8-10 words.",
        hint: "Mention your hobby and reason clearly.",
        time: 40
    }
];

// ==========================================
// UTILITY ALGORITHMS
// ==========================================
function fisherYatesShuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function levenshtein(a, b) {
    const matrix = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
    for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
    for (let j = 0; j <= b.length; j++) matrix[0][j] = j;
    for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
            const cost = a[i - 1] === b[j - 1] ? 0 : 1;
            matrix[i][j] = Math.min(matrix[i - 1][j] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j - 1] + cost);
        }
    }
    return matrix[a.length][b.length];
}

// Fallback adaptive time if quest.time is missing
function getAdaptiveTime(skill, band) {
    const num = parseFloat(band) || 5.0;
    if (skill === 'writing') return num <= 5.0 ? 60 : (num <= 6.5 ? 75 : 90);
    if (skill === 'speaking') return num <= 5.0 ? 40 : (num <= 6.5 ? 50 : 60);
    return num <= 5.0 ? 35 : (num <= 6.5 ? 45 : 55);
}

// ==========================================
// LINEAR PROGRESSION SYSTEM (BAND 4.0 TO 8.0)
// ==========================================
const BAND_THRESHOLDS = [
    { band: "4.0", exp: 0 },
    { band: "4.5", exp: 50 },
    { band: "5.0", exp: 120 },
    { band: "5.5", exp: 210 },
    { band: "6.0", exp: 320 },
    { band: "6.5", exp: 450 },
    { band: "7.0", exp: 600 },
    { band: "7.5", exp: 800 },
    { band: "8.0", exp: 1100 }
];

let playerEXP = 0;
let currentBandIndex = 0;

function updateBandUI() {
    let nextTier = BAND_THRESHOLDS[currentBandIndex + 1];
    let targetExp = nextTier ? nextTier.exp : "MAX";
    let currentBand = BAND_THRESHOLDS[currentBandIndex].band;
    document.getElementById('player-band').innerHTML = `BAND ${currentBand} <span style="font-size:12px; color:#8a99ad;">(EXP: ${playerEXP} / ${targetExp})</span>`;
}

function gainEXP(amount) {
    playerEXP += amount;
    let nextTier = BAND_THRESHOLDS[currentBandIndex + 1];
    if (nextTier && playerEXP >= nextTier.exp) {
        currentBandIndex++;
        log(`🎉 LEVEL UP! You attained BAND ${nextTier.band}! Academic prowess surged!`);
        playerHP = Math.min(maxHP, playerHP + 25);
        updateHPBar();
    }
    updateBandUI();
}

// ==========================================
// PERSISTENT PER-SKILL STATE MANAGEMENT
// ==========================================
const SKILL_PROGRESS = {
    reading: {
        floor: 0,
        pool: [],
        questIndex: 0,
        currentQuest: null,
        timeLeft: 35,
        userInput: '',
        isWon: false,
        lastLog: ''
    },
    listening: {
        floor: 0,
        pool: [],
        questIndex: 0,
        currentQuest: null,
        timeLeft: 35,
        userInput: '',
        isWon: false,
        lastLog: ''
    },
    writing: {
        floor: 0,
        pool: [],
        questIndex: 0,
        currentQuest: null,
        timeLeft: 60,
        userInput: '',
        isWon: false,
        lastLog: ''
    },
    speaking: {
        floor: 0,
        pool: [],
        questIndex: 0,
        currentQuest: null,
        timeLeft: 40,
        userInput: '',
        isWon: false,
        lastLog: ''
    }
};

let currentSkill = 'reading';
let currentQuest = null;
let playerHP = 100;
let maxHP = 100;
let timerInterval = null;
let timeLeft = 35;
const LOOT_POOL = ["Collocation Card", "Paraphrase Scroll", "Inversion Armor", "Lexical Resource Elixir"];

async function selectSkill(newSkill) {
    if (isRecording && recognitionInstance) recognitionInstance.stop();

    // 1. Save current skill state before leaving
    if (currentSkill && SKILL_PROGRESS[currentSkill]) {
        clearInterval(timerInterval);
        SKILL_PROGRESS[currentSkill].timeLeft = timeLeft;
        const inputEl = document.getElementById('text-answer-input');
        if (inputEl) {
            SKILL_PROGRESS[currentSkill].userInput = inputEl.value;
        }
        SKILL_PROGRESS[currentSkill].lastLog = document.getElementById('battle-log').innerText;
    }

    currentSkill = newSkill;
    isActionLocked = false;

    // Highlight active nav tab
    document.querySelectorAll('.hub-nav .hub-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toLowerCase().includes(newSkill));
    });

    const prog = SKILL_PROGRESS[newSkill];

    // 2. If this skill ALREADY has a quest in progress, seamlessly restore it!
    if (prog.currentQuest !== null) {
        currentQuest = prog.currentQuest;
        timeLeft = prog.timeLeft || currentQuest.time || getAdaptiveTime(newSkill, currentQuest.band);
        
        renderQuestDisplay(currentQuest, prog.floor, prog.isWon, prog.userInput);
        if (prog.lastLog) {
            log(prog.lastLog);
        } else {
            log(`⚔️ Resumed Floor ${prog.floor}: ${currentQuest.monster}`);
        }
        
        if (!prog.isWon && playerHP > 0) {
            updateTimerUI();
            startTimer();
        }
        return;
    }

    // 3. First time entering this skill: initialize its pool and load first quest
    document.querySelectorAll('.hub-btn').forEach(b => b.disabled = true);
    const pool = RAW_DATABASE.filter(q => q.skill === newSkill);
    prog.pool = fisherYatesShuffle(pool);
    prog.questIndex = 0;
    
    await loadCurrentQuest();
    document.querySelectorAll('.hub-btn').forEach(b => b.disabled = false);
}

function formatPromptWithBlanks(promptText) {
    if (!promptText) return '';
    return promptText.replace(/\[\.\.\.\]|\[BLANK\]|\[blank\]/g, '<span class="blank-slot">[ &nbsp;...&nbsp; ]</span>');
}

function renderQuestDisplay(q, floor, isWon, savedInput) {
    const mName = document.getElementById('monster-name');
    const mAvt = document.getElementById('monster-avatar');
    mAvt.classList.remove('monster-hit');
    mAvt.innerText = q.avatar || '👾';
    
    if (floor % 10 === 0) {
        mName.innerText = "SUPREME AI EXAMINER (BOSS)";
        mName.style.color = "#ff4757";
        mAvt.style.transform = "scale(1.3)";
    } else {
        mName.innerText = q.monster || 'Abyssal Guardian';
        mName.style.color = "var(--gold)";
        mAvt.style.transform = "scale(1)";
    }

    document.getElementById('monster-meta').innerText = `Floor ${floor} • Band ${q.band || BAND_THRESHOLDS[currentBandIndex].band}`;
    document.getElementById('quest-badge').innerText = (q.type || 'QUEST').replace(/_/g, ' ');

    const ctxContainer = document.getElementById('quest-context-container');
    if (q.skill === 'listening') {
        if (isWon) {
            // Reveal full script if monster has already been defeated!
            ctxContainer.innerHTML = `
                <div class="passage-text" style="border-left-color: var(--hp-green); background: #0c1020;">
                    <div style="font-family: var(--font-game); font-size: 12px; color: var(--gold); margin-bottom: 6px;">📜 AUDIO TRANSCRIPT:</div>
                    <span style="color: #fff; line-height: 1.6;">${q.context}</span>
                </div>
            `;
        } else {
            ctxContainer.innerHTML = `<div class="passage-text" style="font-style: italic; color: #8a99ad; text-align: center;">🔒 (Listening: Script hidden. Play Audio to listen)</div>`;
        }
    } else if (q.context) {
        ctxContainer.innerHTML = `<div class="passage-text">${q.context}</div>`;
    } else {
        ctxContainer.innerHTML = '';
    }

    // Render prompt with highlighted blank slot
    document.getElementById('quest-prompt').innerHTML = `<b>Task:</b> ${formatPromptWithBlanks(q.prompt)}`;
    
    document.querySelectorAll('.hub-btn').forEach(b => b.disabled = false);
    renderInputForQuest(q);

    // Restore user input if previously typed
    if (savedInput) {
        const inp = document.getElementById('text-answer-input');
        if (inp) inp.value = savedInput;
    }

    // If already won on this floor, keep Next Floor button active and lock input
    if (isWon) {
        isActionLocked = true;
        const inp = document.getElementById('text-answer-input');
        if (inp) inp.disabled = true;
        document.getElementById('quest-actions').innerHTML = `<button class="game-btn btn-next" onclick="nextQuestAsync()">NEXT FLOOR ➔</button>`;
    } else {
        isActionLocked = false;
    }
}

async function loadCurrentQuest() {
    clearInterval(timerInterval);
    isActionLocked = true;
    document.querySelectorAll('.hub-btn, #quest-actions .game-btn').forEach(b => b.disabled = true);
    
    const prog = SKILL_PROGRESS[currentSkill];
    if (prog.questIndex >= prog.pool.length) {
        let newQuest = await callAI_GenerateQuest(currentSkill);
        prog.pool.push(newQuest);
    }

    currentQuest = prog.pool[prog.questIndex];
    prog.currentQuest = currentQuest;
    prog.floor++;

    // Adaptive flexible time limit based on Band and Skill
    const baseTime = currentQuest.time || getAdaptiveTime(currentSkill, currentQuest.band);
    prog.timeLeft = prog.floor % 10 === 0 ? baseTime + 20 : baseTime; // Boss floor bonus
    prog.userInput = '';
    prog.isWon = false;
    timeLeft = prog.timeLeft;

    renderQuestDisplay(currentQuest, prog.floor, false, '');

    document.querySelectorAll('.hub-btn').forEach(b => b.disabled = false);
    updateTimerUI();
    startTimer();
    isActionLocked = false;
    log(`⚔️ Floor ${prog.floor}: ${currentQuest.monster} appeared!`);
}

function renderInputForQuest(q) {
    const inputContainer = document.getElementById('quest-input-container');
    const actionsContainer = document.getElementById('quest-actions');

    if (q.type === 'TRUE_FALSE_NOT_GIVEN' || q.type === 'MULTIPLE_CHOICE') {
        const rawOptions = Array.isArray(q.options) && q.options.length > 0 
            ? q.options 
            : ["TRUE", "FALSE", "NOT GIVEN"];
        const opts = q.type === 'MULTIPLE_CHOICE' ? fisherYatesShuffle(rawOptions) : rawOptions;
        
        inputContainer.innerHTML = opts.map(opt => `
            <label class="option-item"><input type="radio" name="user_choice" value="${opt}"> ${opt}</label>
        `).join('');
        actionsContainer.innerHTML = `
            <button class="game-btn btn-submit" onclick="checkAnswerAsync()">ATTACK (SUBMIT)</button>
            ${q.skill === 'listening' ? '<button class="game-btn btn-audio" id="btn-audio-player" onclick="playAudioWhisper()">🔊 AUDIO</button>' : '<button class="game-btn btn-hint" onclick="sacrificeHPHint()">HINT (-15 HP)</button>'}
        `;
    }
    else if (q.type === 'SHORT_ANSWER') {
        inputContainer.innerHTML = `<input type="text" id="text-answer-input" class="quest-input" placeholder="Enter your answer (Press Enter to submit)..." onkeydown="if(event.key==='Enter'&&!event.repeat){event.preventDefault();checkAnswerAsync();}">`;
        actionsContainer.innerHTML = `
            <button class="game-btn btn-submit" onclick="checkAnswerAsync()">ATTACK (SUBMIT)</button>
            ${q.skill === 'listening' ? '<button class="game-btn btn-audio" id="btn-audio-player" onclick="playAudioWhisper()">🔊 AUDIO</button>' : '<button class="game-btn btn-hint" onclick="sacrificeHPHint()">HINT (-15 HP)</button>'}
        `;
    }
    else if (q.type === 'REBUTTAL_WRITING') {
        inputContainer.innerHTML = `<textarea id="text-answer-input" class="quest-input" rows="2" placeholder="Type your complete answer here..."></textarea>`;
        actionsContainer.innerHTML = `<button class="game-btn btn-submit" id="btn-write" onclick="handleWritingAsync()">ATTACK (SUBMIT)</button>`;
    }
    else if (q.type === 'SPEAKING_PROMPT') {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let micBtnHTML = '';
        if (!SpeechRecognition) {
            micBtnHTML = `<button class="game-btn btn-audio" disabled style="background:#555;cursor:not-allowed;">🚫 MIC NOT SUPPORTED (USE CHROME)</button>`;
        } else {
            micBtnHTML = `<button class="game-btn btn-audio" id="mic-trigger-btn" onclick="toggleSpeakingRecord()">🎙️ PRESS TO SPEAK</button>`;
        }

        inputContainer.innerHTML = `
            <div id="speaking-status" style="font-family: var(--font-game); color: var(--gold); margin-bottom: 8px;">Status: Microphone ready...</div>
            <div id="speech-transcript" class="passage-text" style="min-height: 50px; font-style: italic;">(Spoken voice will appear here...)</div>
        `;
        actionsContainer.innerHTML = micBtnHTML;
    }
}

// ==========================================
// ANSWER EVALUATION (ASYNC)
// ==========================================
async function checkAnswerAsync() {
    // Prevent multiple submissions or spam clicking Enter
    if (isActionLocked || (SKILL_PROGRESS[currentSkill] && SKILL_PROGRESS[currentSkill].isWon)) {
        return;
    }

    let userAns = '';
    const inputEl = document.getElementById('text-answer-input');
    if (currentQuest.type === 'SHORT_ANSWER') {
        if (!inputEl) return;
        userAns = inputEl.value.trim().toLowerCase();
        if (!userAns) return log('⚠️ Please enter an answer!');
    } else {
        const checked = document.querySelector('input[name="user_choice"]:checked');
        if (!checked) return log('⚠️ Please select an option!');
        userAns = checked.value.trim().toLowerCase();
    }

    const correctAnsList = Array.isArray(currentQuest.answer) 
        ? currentQuest.answer.map(a => String(a).toLowerCase().trim()) 
        : [String(currentQuest.answer).toLowerCase().trim()];

    const isCorrect = correctAnsList.some(validAns => {
        if (!validAns) return false;
        if (userAns === validAns) return true;
        try {
            const escaped = validAns.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`\\b${escaped}\\b`, 'i');
            if (regex.test(userAns)) return true;
        } catch (e) {}
        if (validAns.length >= 4 && Math.abs(userAns.length - validAns.length) <= 1) {
            if (levenshtein(userAns, validAns) <= 1) return true;
        }
        return false;
    });

    if (isCorrect) {
        // Lock action immediately to prevent double submissions or Enter spam
        isActionLocked = true;
        if (inputEl) inputEl.disabled = true;
        const submitBtn = document.querySelector('.btn-submit');
        if (submitBtn) submitBtn.disabled = true;
        triggerVictory();
    } else {
        // Attack missed: Do NOT leak answer! Provide gentle clue
        takeDamage(25, 'Attack missed! Incorrect answer.', null, currentQuest.hint);
    }
}

async function handleWritingAsync() {
    if (isActionLocked || (SKILL_PROGRESS[currentSkill] && SKILL_PROGRESS[currentSkill].isWon)) {
        return;
    }

    const textInput = document.getElementById('text-answer-input');
    const text = textInput ? textInput.value.trim() : '';
    if (text.length < 8) return log('⚠️ Sentence is too short!');

    const btn = document.getElementById('btn-write');
    btn.disabled = true;
    btn.innerText = "SUBMITTING TO THE ORACLE...";
    clearInterval(timerInterval);
    isActionLocked = true;

    log("👁️ The Oracle Examiner is evaluating grammar and logic...");
    
    let result = await callAI_EvaluateWriting(text, currentQuest.context, currentQuest.prompt);

    if (result.isPassed) {
        const overlay = document.getElementById('objection-overlay');
        document.getElementById('objection-sub').innerText = `"${text}"`;
        overlay.style.display = 'flex';
        setTimeout(() => {
            overlay.style.display = 'none';
            triggerVictory(result.feedback);
        }, 1200);
    } else {
        isActionLocked = false;
        takeDamage(result.damage || 30, 'Rebuttal Failed!', null, result.feedback);
        if (playerHP > 0) {
            btn.disabled = false;
            btn.innerText = "RETRY ATTACK (SUBMIT)";
            startTimer();
        }
    }
}

// ==========================================
// FLUENCY ENGINE (SPEAKING)
// ==========================================
let recognitionInstance = null;
let speechStartTime = 0;
let isRecording = false;

function toggleSpeakingRecord() {
    if (isRecording) {
        if (recognitionInstance) recognitionInstance.stop();
        return;
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micBtn = document.getElementById('mic-trigger-btn');
    const statusBox = document.getElementById('speaking-status');
    const transcriptBox = document.getElementById('speech-transcript');

    recognitionInstance = new SpeechRecognition();
    recognitionInstance.lang = 'en-US';
    recognitionInstance.continuous = true;
    recognitionInstance.interimResults = true;

    recognitionInstance.onstart = () => {
        isRecording = true;
        speechStartTime = Date.now();
        micBtn.innerText = '🔴 RECORDING (Press to STOP)';
        micBtn.style.background = 'var(--hp-red)';
        transcriptBox.innerText = '';
        statusBox.innerText = "Status: Listening to speech audio stream...";
        clearInterval(timerInterval);
    };

    recognitionInstance.onresult = (e) => {
        let res = '';
        for (let i = 0; i < e.results.length; i++) res += e.results[i][0].transcript + ' ';
        transcriptBox.innerText = res;
    };

    recognitionInstance.onerror = (e) => {
        log("⚠️ Mic Error: " + e.error);
        resetMicUI();
        startTimer();
    };

    recognitionInstance.onend = () => {
        isRecording = false;
        resetMicUI();
        processFluencyResult(transcriptBox.innerText);
    };

    recognitionInstance.start();
}

function resetMicUI() {
    const micBtn = document.getElementById('mic-trigger-btn');
    if (micBtn) {
        micBtn.innerText = '🎙️ SPEAK AGAIN';
        micBtn.style.background = '#3498db';
    }
}

function processFluencyResult(transcript) {
    let durationSeconds = (Date.now() - speechStartTime) / 1000;
    if (durationSeconds <= 0) durationSeconds = 1;

    let words = transcript.trim().split(/\s+/).filter(Boolean);
    let wordCount = words.length;
    let wpm = Math.round((wordCount / durationSeconds) * 60);

    document.getElementById('speaking-status').innerText = `Result: ${wordCount} words | ${durationSeconds.toFixed(1)}s | Speed: ${wpm} WPM`;

    if (wordCount >= 8 && wpm >= 85) {
        triggerVictory(`Fluency Mastery! Speech pace reached ${wpm} WPM.`);
    } else if (wordCount < 8) {
        takeDamage(20, `Too brief (${wordCount} words).`, null, "Expand your response to provide sufficient sample.");
        if (playerHP > 0) startTimer();
    } else {
        takeDamage(25, `Pacing hesitant (WPM: ${wpm}).`, null, "Target IELTS fluency speed is > 85 WPM.");
        if (playerHP > 0) startTimer();
    }
}

// ==========================================
// CORE SYSTEM HELPERS & AUDIO
// ==========================================
function playAudioWhisper() {
    if (!('speechSynthesis' in window)) {
        return log('⚠️ Browser does not support Audio synthesis.');
    }

    const audioBtn = document.getElementById('btn-audio-player');
    if (audioBtn) audioBtn.innerText = '🔊 PLAYING...';

    window.speechSynthesis.cancel();
    const textToSpeak = currentQuest.context || currentQuest.prompt;
    const utter = new SpeechSynthesisUtterance(textToSpeak);
    utter.rate = 0.92;
    utter.pitch = 0.95;
    utter.lang = 'en-US';

    // Pick natural English voice if available
    const voices = window.speechSynthesis.getVoices();
    const enVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('US')));
    if (enVoice) utter.voice = enVoice;

    utter.onend = () => {
        if (audioBtn) audioBtn.innerText = '🔊 AUDIO';
    };
    utter.onerror = () => {
        if (audioBtn) audioBtn.innerText = '🔊 AUDIO';
    };

    window.speechSynthesis.speak(utter);
}

function triggerMonsterHitAnimation() {
    const avatar = document.getElementById('monster-avatar');
    const box = document.getElementById('monster-view-box');
    if (!avatar || !box) return;

    avatar.classList.remove('monster-hit');
    void avatar.offsetWidth; // Trigger reflow
    avatar.classList.add('monster-hit');

    // Spawn floating damage text
    const critEl = document.createElement('div');
    critEl.className = 'crit-text';
    critEl.innerText = '⚔️ HIT!';
    box.appendChild(critEl);
    setTimeout(() => { critEl.remove(); }, 800);
}

function triggerScreenShake() {
    const container = document.getElementById('game-container');
    if (!container) return;
    container.classList.remove('screen-shake');
    void container.offsetWidth;
    container.classList.add('screen-shake');
    setTimeout(() => { container.classList.remove('screen-shake'); }, 400);
}

function sacrificeHPHint() {
    if (playerHP <= 15) return log('⚠️ HP too low (<= 15 HP), cannot sacrifice HP!');
    takeDamage(15, 'Sacrificed 15 HP for a Hint!', null, currentQuest.hint || 'Check keywords in the passage carefully.');
}

function takeDamage(amt, reason, explanation = null, clue = null) {
    playerHP = Math.max(0, playerHP - amt);
    updateHPBar();
    triggerScreenShake();
    
    let msg = `💥 ${reason}`;
    if (explanation) {
        msg += ` | Key insight: ${explanation}`;
    } else if (clue) {
        msg += ` | Clue: ${clue}`;
    }
    log(msg);

    const prog = SKILL_PROGRESS[currentSkill];
    if (prog) prog.lastLog = msg;

    if (playerHP <= 0) {
        clearInterval(timerInterval);
        isActionLocked = true;
        if (isRecording && recognitionInstance) recognitionInstance.stop();

        // Reveal script for listening upon defeat
        if (currentQuest.skill === 'listening' && currentQuest.context) {
            const ctxContainer = document.getElementById('quest-context-container');
            if (ctxContainer) {
                ctxContainer.innerHTML = `
                    <div class="passage-text" style="border-left-color: var(--hp-red); background: #0c1020;">
                        <div style="font-family: var(--font-game); font-size: 12px; color: var(--gold); margin-bottom: 6px;">📜 AUDIO TRANSCRIPT:</div>
                        <span style="color: #fff; line-height: 1.6;">${currentQuest.context}</span>
                    </div>
                `;
            }
        }

        setTimeout(() => { 
            const overlay = document.getElementById('game-over-overlay');
            const restartBtn = document.getElementById('btn-restart');
            if (restartBtn) restartBtn.disabled = false;
            overlay.style.display = 'flex'; 
        }, 500);
    }
}

function triggerVictory(customMsg) {
    clearInterval(timerInterval);
    triggerMonsterHitAnimation();
    
    const prog = SKILL_PROGRESS[currentSkill];
    prog.isWon = true;
    isActionLocked = true;

    // Gradual EXP gain: +15 EXP normally, +25 on boss floors
    const expGain = prog.floor % 10 === 0 ? 25 : 15;
    gainEXP(expGain); 

    let msg = customMsg || 'Enemy was vanquished!';
    if (prog.floor % 5 === 0) {
        const loot = LOOT_POOL[Math.floor(Math.random() * LOOT_POOL.length)];
        msg += ` 🎁 Loot Discovered: ${loot}!`;
    }

    let victoryLog = `🎉 VICTORY: ${msg}`;
    if (currentQuest.explanation) {
        victoryLog += ` | Key insight: ${currentQuest.explanation}`;
    }
    log(victoryLog);
    prog.lastLog = victoryLog;

    // Reveal Listening transcript when enemy is defeated!
    if (currentQuest.skill === 'listening' && currentQuest.context) {
        const ctxContainer = document.getElementById('quest-context-container');
        if (ctxContainer) {
            ctxContainer.innerHTML = `
                <div class="passage-text" style="border-left-color: var(--hp-green); background: #0c1020;">
                    <div style="font-family: var(--font-game); font-size: 12px; color: var(--gold); margin-bottom: 6px;">📜 AUDIO TRANSCRIPT:</div>
                    <span style="color: #fff; line-height: 1.6;">${currentQuest.context}</span>
                </div>
            `;
        }
    }

    document.getElementById('quest-actions').innerHTML = `<button class="game-btn btn-next" onclick="nextQuestAsync()">NEXT FLOOR ➔</button>`;
}

async function nextQuestAsync() {
    isActionLocked = false;
    const prog = SKILL_PROGRESS[currentSkill];
    prog.questIndex++;
    prog.isWon = false;
    prog.userInput = '';
    await loadCurrentQuest();
}

function updateHPBar() {
    const bar = document.getElementById('player-hp');
    const pct = (playerHP / maxHP) * 100;
    bar.style.width = pct + '%';
    document.getElementById('hp-num').innerText = `${playerHP}/${maxHP}`;
    bar.style.backgroundColor = pct < 30 ? 'var(--hp-red)' : 'var(--hp-green)';
}

function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerUI();
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            isActionLocked = true;
            const ansStr = Array.isArray(currentQuest.answer) ? currentQuest.answer[0] : currentQuest.answer;
            takeDamage(30, 'TIME OUT! The monster strikes!', `Correct answer: "${ansStr}". ${currentQuest.explanation || ''}`);
            
            // Reveal transcript for listening on timeout
            if (currentQuest.skill === 'listening' && currentQuest.context) {
                const ctxContainer = document.getElementById('quest-context-container');
                if (ctxContainer) {
                    ctxContainer.innerHTML = `
                        <div class="passage-text" style="border-left-color: var(--hp-red); background: #0c1020;">
                            <div style="font-family: var(--font-game); font-size: 12px; color: var(--gold); margin-bottom: 6px;">📜 AUDIO TRANSCRIPT:</div>
                            <span style="color: #fff; line-height: 1.6;">${currentQuest.context}</span>
                        </div>
                    `;
                }
            }

            if (playerHP > 0) nextQuestAsync();
        }
    }, 1000);
}

function updateTimerUI() { document.getElementById('timer-box').innerText = `⏳ ${timeLeft}s`; }
function log(txt) { document.getElementById('battle-log').innerText = txt; }

function restartGame() {
    document.getElementById('game-over-overlay').style.display = 'none';
    playerHP = maxHP;
    playerEXP = 0;
    currentBandIndex = 0;
    isActionLocked = false;
    
    // Reset all skill states
    for (const s in SKILL_PROGRESS) {
        SKILL_PROGRESS[s].floor = 0;
        SKILL_PROGRESS[s].pool = [];
        SKILL_PROGRESS[s].questIndex = 0;
        SKILL_PROGRESS[s].currentQuest = null;
        SKILL_PROGRESS[s].timeLeft = 35;
        SKILL_PROGRESS[s].userInput = '';
        SKILL_PROGRESS[s].isWon = false;
        SKILL_PROGRESS[s].lastLog = '';
    }
    
    updateBandUI();
    updateHPBar();
    selectSkill(currentSkill);
}

// Initial voices load for TTS
if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
    };
}

// Launch Game with reading skill
updateBandUI();
selectSkill('reading');
</script>
